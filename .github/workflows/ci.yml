name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://language:language@localhost:5432/language
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: language
          POSTGRES_USER: language
          POSTGRES_PASSWORD: language
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U language -d language"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm content:audit:mvp
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
        env:
          NODE_ENV: production
      - run: pnpm publication:validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm api:smoke:production
