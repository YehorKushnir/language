name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: morpho-learning-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build ${{ matrix.target }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Verify published image
        run: |
          image=$(printf '%s' "ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$image"

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/morpho_deploy
          chmod 0600 ~/.ssh/morpho_deploy
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Upload versioned deployment configuration
        run: |
          set -euo pipefail
          tar -czf /tmp/morpho-learning-release.tgz \
            compose.production.yaml \
            deploy/caddy-sites \
            scripts/deploy
          scp -i ~/.ssh/morpho_deploy \
            /tmp/morpho-learning-release.tgz \
            deploy@95.169.192.201:/home/deploy/morpho-learning-release.tgz
          ssh -i ~/.ssh/morpho_deploy deploy@95.169.192.201 <<'REMOTE'
            set -euo pipefail
            install -d -m 0750 /home/deploy/morpho-learning
            tar -xzf /home/deploy/morpho-learning-release.tgz \
              -C /home/deploy/morpho-learning
            rm /home/deploy/morpho-learning-release.tgz
            chmod 0750 /home/deploy/morpho-learning/scripts/deploy/*.sh
          REMOTE

      - name: Deploy immutable image tag
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/morpho_deploy deploy@95.169.192.201 \
            "/home/deploy/morpho-learning/scripts/deploy/ci-deploy.sh '${{ github.sha }}'"
