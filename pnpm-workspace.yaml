packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  deepmerge-ts@<8.0.0: 8.0.0
  fast-uri@<3.1.6: 3.1.6
  mysql2@<3.23.1: 3.23.1
  qs@<6.16.0: 6.16.0

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  '@scarf/scarf': false
  protobufjs: true
