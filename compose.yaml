services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: language
      POSTGRES_USER: language
      POSTGRES_PASSWORD: language
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U language -d language']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
